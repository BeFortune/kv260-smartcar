# Reduced-scope cosim only: 30 valid tokens, no 659/660-token RTL case.
# Vitis Unified 2026.1 option names checked against installed tool data.
# Explicit 64-bit AXI configuration; emitted cfg is NOT a hardware sign-off.
# Actual device support, csim/csynth, RTL ABI/address widths, cosim,
# packaging and implemented timing must be checked in successful tool runs.
part=xck26-sfvc784-2LV-c

[hls]
clock=10
flow_target=vivado
syn.top=ffn_accel
syn.interface.m_axi_addr64=true
syn.file=../ffn_accel.cpp
syn.file_cflags=../ffn_accel.cpp,-std=c++11 -DFFN_USE_HLS_MATH -ffp-contract=off
syn.file_csimflags=../ffn_accel.cpp,-std=c++11 -DFFN_USE_HLS_MATH -ffp-contract=off
tb.file=../testbench_cosim_small.cpp
tb.file_cflags=../testbench_cosim_small.cpp,-std=c++11 -DFFN_USE_HLS_MATH -ffp-contract=off
package.output.format=ip_catalog
package.output.syn=false
